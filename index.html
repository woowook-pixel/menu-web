  <title>Bite</title>

<body>
  <main class="pf-screen" id="main"><div class="skeleton"></div></main>
  <nav class="pf-tabbar" aria-label="화면 전환">
    <a href="#/" data-tab="home"><pf-sym name="today"></pf-sym><span>오늘</span></a>
    <a href="#/week" data-tab="week"><pf-sym name="calendar"></pf-sym><span>이번 주</span></a>
  </nav>
  <div class="pf-update" id="update" role="status" hidden>
    <span class="pf-update-text">새 버전이 있습니다</span>
    <button type="button" class="pf-update-later">나중에</button>
    <button type="button" class="pf-update-reload"><pf-sym name="refresh"></pf-sym>새로고침</button>
  </div>

  <dialog id="confirm" class="dialog pf-sheet">
    <h2>덮어쓸까요?</h2>
    <p id="confirm-msg"></p>
    <div class="dialog-actions">
      <button type="button" value="cancel">취소</button>
      <button type="button" class="danger" value="ok">덮어쓰기</button>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
