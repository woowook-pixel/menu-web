<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="오늘 뭐 먹지">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>오늘 뭐 먹지 · 구내식당</title>
</head>
<body>
  <header class="navbar"><span id="nav-title"></span></header>
  <main class="content" id="main"><div class="skeleton"></div></main>
  <nav class="tabbar">
    <a href="#/" class="tab" data-tab="home">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M9 3v9.2a3 3 0 0 1-1.2 2.4V25H6.2V14.6A3 3 0 0 1 5 12.2V3h1.6v8h.9V3h1.6v8h.9V3H9zm10.5 0c2.2 0 3.5 2.6 3.5 6.2 0 2.9-1.1 5-2.7 5.6V25h-1.6V3h.8z" fill="currentColor"/></svg>
      <span>오늘</span>
    </a>
    <a href="#/week" class="tab" data-tab="week">
      <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="3.5" y="5" width="21" height="19" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10.5h21M9 3v4M19 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="15" r="1.4" fill="currentColor"/><circle cx="14" cy="15" r="1.4" fill="currentColor"/><circle cx="19" cy="15" r="1.4" fill="currentColor"/><circle cx="9" cy="19.5" r="1.4" fill="currentColor"/><circle cx="14" cy="19.5" r="1.4" fill="currentColor"/></svg>
      <span>이번 주</span>
    </a>
  </nav>

  <dialog id="confirm" class="dialog">
    <h2>덮어쓸까요?</h2>
    <p id="confirm-msg"></p>
    <div class="dialog-actions">
      <button type="button" value="cancel">취소</button>
      <button type="button" class="danger" value="ok">덮어쓰기</button>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
